<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACE CORP</title>
  <link rel="icon" href="favicon_ace/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-loader" id="siteLoader" role="status" aria-live="polite">
    <div class="loader-kicker">ace corp // boot sequence</div>
    <div class="loader-title">loading memories</div>
    <div class="loader-status" id="loaderStatus">preparing media 0/0</div>
    <div class="loader-track" aria-hidden="true">
      <div class="loader-progress" id="loaderProgress"></div>
    </div>
  </div>

  <header class="site-header">
    <div class="brand-lockup" aria-label="ACE CORP">
      <span class="brand-mark">
        <img src="imgs/acecorp.png" alt="">
      </span>
      <span>
        <span class="brand-title">ACE CORP</span>
      </span>
    </div>

    <nav class="terminal-nav" aria-label="Secoes">
      <a href="#archive">archive</a>
      <a class="menu-return" href="../index.html" aria-label="Voltar ao menu">cd ../menu</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>VIDEO ARCHIVE</h1>
      <p class="hero-copy">
        Galeria de memorias em formato .mp4. Clique em qualquer registro para abrir o player.
      </p>
    </section>

    <section class="archive-shell" id="archive" aria-labelledby="archiveTitle">
      <div class="archive-header">
        <div>
          <p class="eyebrow">memories / selected memorie</p>
          <h2 id="archiveTitle">NEW MEMORIES</h2>
        </div>
        <p class="archive-count"><span id="videoCount">00</span> arquivos</p>
      </div>

      <div class="project-list" id="projectList" aria-live="polite"></div>
    </section>
  </main>

  <div class="video-modal" id="videoModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" data-close-modal aria-label="Fechar video">×</button>
      <div class="video-frame">
        <video id="myVideo" controls preload="metadata"></video>
      </div>
      <aside class="modal-copy">
        <p class="modal-kicker" id="modalCode">mem_00</p>
        <h2 id="modalTitle">Titulo</h2>
        <p id="modalDescription">Descricao</p>
        <p class="modal-path" id="modalPath">../vds/video.mp4</p>
      </aside>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
